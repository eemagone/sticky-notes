<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Sticky notes</title>
<link rel="stylesheet" href="launcher.css">
</head>
<body>
<header class="bar">
  <h1 id="heading">Sticky notes</h1>
  <button id="close" class="icon" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</header>

<main id="home">
  <button id="new" class="primary">+ New note</button>
  <button id="reopen" class="secondary">Reopen last closed note</button>
  <h2>Open notes</h2>
  <ul id="open" class="list"></ul>
  <h2>Archived notes <button id="openArchive" class="link">Open folder</button></h2>
  <ul id="archived" class="list"></ul>
</main>

<main id="setup" hidden>
  <div class="stage"><div id="preview"><b>Untitled</b><i></i><i></i><i></i></div></div>
  <label>Width <span class="num"><input id="wNum" type="number" min="200" max="800" aria-label="Width in pixels"> px</span>
    <input id="w" type="range" min="200" max="800" value="300">
  </label>
  <label>Height <span class="num"><input id="hNum" type="number" min="160" max="1000" aria-label="Height in pixels"> px</span>
    <input id="h" type="range" min="160" max="1000" value="360">
  </label>
  <div id="colorRow">
    <div class="label">Colour</div>
    <div id="swatches"></div>
  </div>
  <div class="actions">
    <button id="cancel">Cancel</button>
    <button id="create" class="primary">Create note</button>
  </div>
</main>
<script src="launcher.js"></script>
</body>
</html>
